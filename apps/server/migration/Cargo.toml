[package]
edition      = "2024"
name         = "migration"
publish      = false
rust-version = "1.85.0"
version      = "0.1.0"

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Migrations that discard data warn about it so an operator knows to re-link a
# provider afterwards.
logger = { path = "../../../crates/logger" }

[dependencies.sea-orm-migration]
# rustls, not native-tls: on Linux native-tls pulls OpenSSL as a build
# dependency. SQLite has no TLS of its own, but the TLS feature still has to
# resolve to something, and rustls keeps the build dependency-free.
features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
]
version = "~2.0.0-rc"
