[package]
edition      = "2024"
name         = "migration"
publish      = false
rust-version = "1.85.0"
version      = "0.1.0"

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Migrations that discard data warn about it so an operator knows to re-link a
# provider afterwards.
logger = { path = "../../../crates/logger" }

[dependencies.sea-orm-migration]
features = [
    "runtime-tokio-native-tls",
    "sqlx-sqlite",
]
version = "~2.0.0-rc"
