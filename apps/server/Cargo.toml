[package]
name = "pass-manager"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration"]

[dependencies]
logger = { path = "../../crates/logger" }
actix-web = "4"
actix-files = "0.6"
sea-orm = { version = "2.0.0-rc", features = ["sqlx-sqlite", "runtime-tokio", "macros", "with-uuid"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.20.0", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
actix-cors = "0.7.1"
actix-session = { version = "0.11", features = ["cookie-session"] }
base64 = "0.22"
tokio = { version = "1", features = ["net"] }
urlencoding = "2"
rand = "0.8"
dirs = "5.0"
sha2 = "0.10"
# HMAC-SHA256 for verifying recovery proofs server-side. Pairs with the sha2
# already above and is already in the lock file (transitively, via cookie), so
# this adds no new third-party code to the build — only a direct dependency edge.
# Chosen over hand-rolling HMAC: the ipad/opad construction and constant-time
# finalize are exactly the kind of detail that is easy to get subtly wrong.
hmac = "0.12"
migration = { path = "migration" }

# TLS backend is target-specific on purpose:
# - Linux builds with rustls, so they never need OpenSSL headers/pkg-config
#   (native-tls resolves to OpenSSL there) or libssl at runtime.
# - Other platforms keep the previous stack unchanged: reqwest's defaults still
#   select native-tls (Security.framework on macOS), while rustls stays enabled
#   as it was before.
[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "http2", "charset", "system-proxy"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"] }
